name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: "Release"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Get the version
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

    - name: Restore Nuget Packages
      run: dotnet restore FileProcessor.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build FileProcessor.sln --configuration Release      

    - name: Restore Publish Assets
      run: dotnet restore "FileProcessor\FileProcessor.csproj" -r win-x64 --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Publish Images to Docker Hub - Pre Release
      if: ${{ github.event.release.prerelease == true }} 
      run: |
        docker build . --file FileProcessor/Dockerfile --tag stuartferguson/fileprocessor:dev
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/fileprocessor:dev

    - name: Publish Images to Docker Hub - Formal Release
      if: ${{ github.event.release.prerelease == false }} 
      run: |
        docker build . --file FileProcessor/Dockerfile --tag stuartferguson/fileprocessor:latest
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/fileprocessor:latest

    - name: Publish API
      if: ${{ github.event.release.prerelease == false }}
      run: dotnet publish "FileProcessor\FileProcessor.csproj" --configuration Release --output publishOutput -r win-x64 --self-contained --no-restore
              -p:Version=${{ steps.get_version.outputs.VERSION }}
              -p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}
              -p:FileVersion=${{ steps.get_version.outputs.VERSION }}
              -p:InformationalVersion=${{ steps.get_version.outputs.VERSION }}
    
    - name: Build Release Package
      run: |
         cd /home/runner/work/FileProcessor/FileProcessor/publishOutput
         zip -r ../fileprocessor.zip ./*

    - name: Upload the artifact
      uses: actions/upload-artifact@v4.4.0
      with:
        name: fileprocessor
        path: fileprocessor.zip
        
    - name: Build and Publish Nuget Packages
      if: ${{ github.event.release.prerelease == false }}
      run: |
        dotnet pack "FileProcessor.File.DomainEvents\FileProcessor.File.DomainEvents.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets -c Release
        dotnet nuget push Nugets/FileProcessor.File.DomainEvents.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }} --skip-duplicate
        dotnet pack "FileProcessor.FileImportLog.DomainEvents\FileProcessor.FileImportLog.DomainEvents.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets -c Release
        dotnet nuget push Nugets/FileProcessor.FileImportLog.DomainEvents.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }} --skip-duplicate
        dotnet pack "FileProcessor.FileProfile.DomainEvents\FileProcessor.FileProfile.DomainEvents.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets -c Release
        dotnet nuget push Nugets/FileProcessor.FileProfile.DomainEvents.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }} --skip-duplicate
        dotnet pack "FileProcessor.Client\FileProcessor.Client.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets -c Release
        dotnet nuget push Nugets/FileProcessor.Client.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }} --skip-duplicate

  deploystaging:
    runs-on: [stagingserver,windows]
    needs: build
    environment: staging
    name: "Deploy to Staging"
    env:
      FILEPROCESSOR_CERTIFICATE_PATH: ${{ secrets.FILEPROCESSOR_CERTIFICATE_PATH }}
      FILEPROCESSOR_CERTIFICATE_PASSWORD: ${{ secrets.FILEPROCESSOR_CERTIFICATE_PASSWORD }}
    
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: fileprocessor

      - name: Check staging HTTPS certificate settings
        shell: powershell
        run: |
          if (-not $env:FILEPROCESSOR_CERTIFICATE_PATH -or -not $env:FILEPROCESSOR_CERTIFICATE_PASSWORD) {
            throw "FILEPROCESSOR_CERTIFICATE_PATH and FILEPROCESSOR_CERTIFICATE_PASSWORD must be configured in the staging environment."
          }
          if (-not (Test-Path -LiteralPath $env:FILEPROCESSOR_CERTIFICATE_PATH -PathType Leaf)) {
            throw "The configured FileProcessor certificate PFX does not exist on the staging server."
          }
  
      - name: Remove existing  Windows service
        run: |
          $serviceName = "Transaction Processing - File Processor"
          # Check if the service exists
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName
            sc.exe delete $serviceName
          }

      - name: Unzip the files
        run: |
          Expand-Archive -Path fileprocessor.zip -DestinationPath "C:\txnproc\transactionprocessing\fileprocessor" -Force
      
      - name: Install as a Windows service
        run: |
          $serviceName = "Transaction Processing - File Processor"
          $servicePath = "C:\txnproc\transactionprocessing\fileprocessor\FileProcessor.exe"
                   
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          $serviceRegistryPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
          $serviceEnvironment = @(
            "ASPNETCORE_ENVIRONMENT=Staging",
            "ASPNETCORE_URLS=https://*:5001",
            "ServiceOptions__KestrelOptions__Path=$env:FILEPROCESSOR_CERTIFICATE_PATH",
            "ServiceOptions__KestrelOptions__Password=$env:FILEPROCESSOR_CERTIFICATE_PASSWORD"
          )
          New-ItemProperty -Path $serviceRegistryPath -Name Environment -PropertyType MultiString -Value $serviceEnvironment -Force | Out-Null
          Start-Service -Name $serviceName  
          curl.exe --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 --retry-max-time 90 --max-time 10 --output NUL --write-out "%{http_code}" https://192.168.1.163:5001/health
          if ($LASTEXITCODE -ne 0) { throw "Trusted HTTPS health probe failed for FileProcessor on the staging server." }

  deployproduction:
    runs-on: [productionserver, windows]
    needs: [build, deploystaging]
    environment: production
    name: "Deploy to Production"
    env:
      FILEPROCESSOR_CERTIFICATE_PATH: ${{ secrets.FILEPROCESSOR_CERTIFICATE_PATH }}
      FILEPROCESSOR_CERTIFICATE_PASSWORD: ${{ secrets.FILEPROCESSOR_CERTIFICATE_PASSWORD }}
    
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: fileprocessor

      - name: Check production HTTPS certificate settings
        shell: powershell
        run: |
          if (-not $env:FILEPROCESSOR_CERTIFICATE_PATH -or -not $env:FILEPROCESSOR_CERTIFICATE_PASSWORD) {
            throw "FILEPROCESSOR_CERTIFICATE_PATH and FILEPROCESSOR_CERTIFICATE_PASSWORD must be configured in the production environment."
          }
          if (-not (Test-Path -LiteralPath $env:FILEPROCESSOR_CERTIFICATE_PATH -PathType Leaf)) {
            throw "The configured FileProcessor certificate PFX does not exist on the production server."
          }
  
      - name: Remove existing  Windows service
        run: |
          $serviceName = "Transaction Processing - File Processor"
          # Check if the service exists
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName
            sc.exe delete $serviceName
          }

      - name: Unzip the files
        run: |
          Expand-Archive -Path fileprocessor.zip -DestinationPath "C:\txnproc\transactionprocessing\fileprocessor" -Force
      
      - name: Install as a Windows service
        run: |
          $serviceName = "Transaction Processing - File Processor"
          $servicePath = "C:\txnproc\transactionprocessing\fileprocessor\FileProcessor.exe"
                   
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          $serviceRegistryPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
          $serviceEnvironment = @(
            "ASPNETCORE_ENVIRONMENT=Production",
            "ASPNETCORE_URLS=https://*:5001",
            "ServiceOptions__KestrelOptions__Path=$env:FILEPROCESSOR_CERTIFICATE_PATH",
            "ServiceOptions__KestrelOptions__Password=$env:FILEPROCESSOR_CERTIFICATE_PASSWORD"
          )
          New-ItemProperty -Path $serviceRegistryPath -Name Environment -PropertyType MultiString -Value $serviceEnvironment -Force | Out-Null
          Start-Service -Name $serviceName
