name: Build and Test Pull Requests

on:
  pull_request:
    branches:
    - main

jobs:
  build:
    name: Build and Test Pull Requests
    env:
      ASPNETCORE_ENVIRONMENT: Production

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100

      - name: Echo vars
        run: |
          echo "CI is > ${CI}"
          echo "HOME is > ${HOME}"

      - name: Restore Nuget Packages
        run: dotnet restore FileProcessor.sln --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

      - name: Build Code
        run: dotnet build FileProcessor.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: |
          echo "ASPNETCORE_ENVIRONMENT are > ${ASPNETCORE_ENVIRONMENT}"
          dotnet test "FileProcessor.BusinessLogic.Tests/FileProcessor.BusinessLogic.Tests.csproj" --configuration Release --no-build --verbosity normal -- --report-xunit-trx --report-xunit-trx-filename businesslogic-test-results.trx
          dotnet test "FileProcessor.FileAggregate.Tests/FileProcessor.FileAggregate.Tests.csproj" --configuration Release --no-build --verbosity normal -- --report-xunit-trx --report-xunit-trx-filename fileaggregate-test-results.trx
          dotnet test "FileProcessor.FileImportLogAggregate.Tests/FileProcessor.FileImportLogAggregate.Tests.csproj" --configuration Release --no-build --verbosity normal -- --report-xunit-trx --report-xunit-trx-filename fileimportlogaggregate-test-results.trx

      - name: Build Docker Image
        run: docker build . --file FileProcessor/Dockerfile --tag fileprocessor:latest

      - name: Run Integration Tests
        run: |
          diagnostics_file="$RUNNER_TEMP/fileprocessor-container-ports.log"
          (
            while true; do
              date --iso-8601=seconds
              for container_id in $(docker ps --quiet --filter ancestor=fileprocessor:latest); do
                docker inspect --format '{{.Name}} {{json .NetworkSettings.Ports}} {{json .NetworkSettings.Networks}}' "$container_id"
              done
              sleep 5
            done
          ) > "$diagnostics_file" 2>&1 &
          monitor_pid=$!

          set +e
          dotnet test "FileProcessor.IntegrationTests/FileProcessor.IntegrationTests.csproj" --configuration Release --no-build --verbosity normal -- --filter "Category=PRTest"
          test_status=$?
          kill "$monitor_pid" 2>/dev/null
          wait "$monitor_pid" 2>/dev/null
          set -e

          cat "$diagnostics_file"
          exit "$test_status"

      - uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: tracelogs
          path: /home/runner/trace/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*'
          retention-days: 30

      - name: Upload Docker port diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-port-diagnostics
          path: ${{ runner.temp }}/fileprocessor-container-ports.log
          if-no-files-found: ignore
